<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob:; script-src 'self'; style-src 'self'; img-src 'self' data: blob: file:; media-src 'self' blob: file:; connect-src 'none'; object-src 'none'">
  <title>Oteener Sound Design</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar"><a class="brand" href="#" aria-label="Oteener home"><span class="brand-mark">ø</span><span>OTEENER<span class="brand-sub">SOUND DESIGN</span></span></a><span class="edition">SOUNDPRIME <b>01</b></span><button id="help" class="icon-button" title="راهنما" aria-label="راهنما">?</button></header>
  <main>
    <section class="hero"><div><div class="eyebrow"><span class="live-dot"></span> YOUR SOUND. YOUR SIGNATURE.</div><h1 dir="rtl">هر لحظه،<br><span>صدای خودش.</span></h1><p dir="rtl">اوتینر ساند دیزاین <span class="slash">/</span> صداهایت، یک میان‌بر نزدیک‌تر.</p></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit second"></div><div class="sound-glyph"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span>MAKE SOME<br>GOOD NOISE ↗</span></div></section>
    <section class="session-bar" aria-label="تنظیمات تایم‌لاین"><div class="connection"><span id="connection-dot" class="live-dot muted"></span><span id="connection">CONNECTING</span></div><label class="track-label">TARGET <select id="track" aria-label="ترک صوتی مقصد"><option value="0">A1</option></select></label><button id="enabled" class="toggle" aria-pressed="true">⌘ <span>میان‌برها روشن</span></button></section>
    <section class="library"><div class="section-heading"><div><h2>SOUND BANK <span id="count">00 / 09</span></h2><p dir="rtl">روی پد بزن، روی تایم‌لاین بنشان.</p></div><button id="import" class="primary">＋ <span>افزودن صدا</span></button></div><div id="pads" class="pads" aria-label="۹ پد ساند افکت"></div></section>
    <section class="monitor"><div class="monitor-icon">◖◗</div><div class="monitor-title"><span class="eyebrow">PREVIEW MONITOR</span><span id="now-playing" dir="rtl">صدایی در حال پخش نیست</span></div><button id="stop" class="icon-button" aria-label="توقف پیش‌شنوی" title="توقف">■</button><label class="volume-label"><span>VOL</span><input id="volume" type="range" min="0" max="100" value="70" aria-label="بلندی پیش‌شنوی"><output id="volume-value">70%</output></label></section>
    <footer><span>BUILT FOR YOUR FLOW <span class="yellow">↗</span></span><div><button id="kys">بررسی میان‌بر پریمیر</button><button id="export-bank">ذخیره بانک</button><button id="import-bank">بازیابی بانک</button></div><span>v1.0.0</span></footer>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>
<div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" dir="rtl"><button id="close-dialog" class="close icon-button" aria-label="بستن">×</button><div id="dialog-body"></div></section></div>
<input id="audio-files" type="file" accept=".wav,.mp3,.aif,.aiff,.m4a,.aac,.flac,.ogg" multiple hidden>
<input id="bank-file" type="file" accept=".json" hidden><input id="kys-file" type="file" accept=".kys" hidden>
<script src="js/core.js"></script><script src="js/app.js"></script>
</body></html>
